[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/cli", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
warsel-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
